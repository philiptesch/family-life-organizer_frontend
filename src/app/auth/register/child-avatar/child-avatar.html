<section>


    <main>

        <div class="headline">
         <mat-icon class="arrow" (click)="emitEvent()" > arrow_back</mat-icon>
        <header>
            <h1> Kinder hinzufügen</h1>
            <h6> Ergänze die Informationen der Kinder </h6>
        </header>

        </div>

    <form action="" #childform ="ngForm" (ngSubmit)="onSubmit($event, childform)" >
        <div class="childImageSection">
   
           
            <div>
        
                <img  class="child-img" [src]="imageSrc" alt="">

                <img (click)="fileInput.click()" class="camera-img" src="/assets/img/camera.png" alt="">

                <input  name="image" #fileInput class="image-file" type="file"  accept="image/*" (change)="onFileSelected($event)" [(ngModel)]="child.image" #image="ngModel"   >

            </div>


        </div>


        <div class="child-query" >

       
            <div class="child-name">
                <label for=""> Name</label>

                <div class="child-name-area">
                    <input  name="name" class="child-name-field" type="text" placeholder="Name" [(ngModel)]="child.name" #name="ngModel">

                </div>
            </div>    

                <div class="Child-age-and-birth">


                 <div class="child-age">
                <label for=""> Alter</label>

                <div class="child-age-area">
                    <input class="child-age-field" type="number" min="8" step="1" name="age" placeholder="Alter" [(ngModel)]="child.age" #age="ngModel">

                </div>
            </div> 


            <div class="child-birth">
                <label for=""> Geburtsdatum</label>

                <div class="child-birth-area">
                    <input class="child-birth-field" name="birthdate"  type="date" min="2018-12-31" placeholder="Geburtsdatum" [(ngModel)]="child.birthdate" #birthdate="ngModel">

                </div>
            </div> 

           

                

            </div>
             <div class="genderSection">
 

                <label class="label-gender" for=""> Geschlecht</label>
                <div class="child-gender-query">

                <div class="gender-boy">
                <input type="radio" name="gender" id="boy" [(ngModel)]="child.gender" #gender="ngModel" name="gender">
                <label for=""> Junge</label> 
                 </div>   
                 
                <div class="gender-girl">
                <input type="radio" name="gender" id="girl"[(ngModel)]="child.gender" #gender="ngModel" name="gender" >
                <label for=""> Mädchen</label> 
                </div>   
                </div>    
                
            

            </div>


            <div class="child-Image-query" >
             <div class="child-Image-Selection-Section">  
                <div class="child-Image-query-headline">

                    <h3>Vorgefertige Bilder</h3>
                    <h6> Wähle ein Bild aus</h6>
                </div>


                <div class="child-Image-Selection">

                    <div class="child-Image-field" [class.selected]="selectedAvatar === 1"
                    (click)="selectAvatar(1)">
                    <img class="child-img"  src="/assets/img/avatar_single_1_small.png" alt="">
                    </div>    

                    <div class="child-Image-field" [class.selected]="selectedAvatar === 2"
                    (click)="selectAvatar(2)">
                    <img class="child-img"  src="/assets/img/avatar_single_2_small.png" alt="">
                     </div>


                    <div class="child-Image-field" [class.selected]="selectedAvatar === 3"
                    (click)="selectAvatar(3)">
                    <img class="child-img"  src="/assets/img/avatar_single_3_small.png" alt="">
                    </div>


                    <div class="child-new-image"
                    (click)="fileInput.click()">
                        <span> Mehr </span>
                          <mat-icon > chevron_right </mat-icon>
                    </div>
                </div>
            </div> 


            </div>


            <div class="btn-section" type>
            <button type="submit">Speichern </button>

            </div>



        




        </div>
       </form> 


    </main>




</section>
